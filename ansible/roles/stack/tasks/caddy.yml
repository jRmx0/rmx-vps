# Caddy's server-only files: OTA images folder and the /fw/ download logins.
# The users file must exist or Caddy won't start (README §10 "Firmware images").

- name: Caddy folders
  ansible.builtin.file:
    path: "{{ services_dir }}/caddy/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: firmware, owner: "{{ admin_user }}", mode: "0755" }
    - { path: firmware/probe, owner: "{{ admin_user }}", mode: "0755" }
    - { path: private, owner: root, mode: "0700" }

- name: /fw/ logins (bcrypt hashes, what Caddy reads)
  ansible.builtin.copy:
    dest: "{{ services_dir }}/caddy/private/fw-users.caddy"
    content: |
      {% for u in vault_caddy_fw_users %}
      {{ u.name }} {{ u.hash }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart caddy

- name: /fw/ logins (plain-text copy for you)
  ansible.builtin.copy:
    dest: "{{ services_dir }}/caddy/private/credentials.txt"
    content: |
      {% for u in vault_caddy_fw_users %}
      {{ u.name }} {{ u.password }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true
