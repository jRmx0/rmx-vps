# -e probe=on: start the probe and create its app logins (the "users" table
# lives in the probe database, so they are created through the app).

- name: Start the probe
  ansible.builtin.command: docker compose --profile probe up -d
  args: { chdir: "{{ services_dir }}" }
  register: probe_up
  changed_when: probe_up.stderr is search('Created|Recreated|Started')

- name: Wait until probe-app is healthy
  ansible.builtin.command: docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' probe-app
  register: probe_health
  until: probe_health.stdout == 'healthy'
  retries: 30
  delay: 5
  changed_when: false

# The password goes in on stdin, never on a command line. A login that
# exists already makes the command fail; that is fine.
- name: App logins
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, probe-app, /app/probe-server, create-user, "{{ item.key }}"]
    stdin: "{{ item.value }}"
    chdir: "{{ services_dir }}"
  loop: "{{ vault_probe_app_users | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  register: probe_user
  failed_when: false
  changed_when: probe_user.rc == 0
  no_log: true
