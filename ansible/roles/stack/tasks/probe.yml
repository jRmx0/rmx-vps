# The probe's server-only files and the deploy script (README §10 "Probe").
# The containers only start with -e probe=on (probe-on.yml).

- name: Probe data folder
  ansible.builtin.file:
    path: "{{ services_dir }}/probe/data"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Created on the first run with the image tag from the vault; later runs
# only keep the passwords in line. PROBE_TAG belongs to the deploy script.
- name: Probe env file
  ansible.builtin.template:
    src: probe.env.j2
    dest: "{{ services_dir }}/probe/.env"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
    force: false
  no_log: true

- name: Passwords in probe/.env
  ansible.builtin.lineinfile:
    path: "{{ services_dir }}/probe/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: PROBE_DB_PASSWORD, value: "{{ vault_probe_db_password }}" }
    - { key: PROBE_MQTT_PASSWORD, value: "{{ vault_mosquitto_users['probe-app'] }}" }
  loop_control: { label: "{{ item.key }}" }
  no_log: true

- name: Plain-text copies of the probe logins (for you)
  ansible.builtin.copy:
    dest: "{{ services_dir }}/probe/data/credentials.txt"
    content: |
      db-password {{ vault_probe_db_password }}
      {% for user, password in vault_probe_app_users.items() %}
      app-login {{ user }} {{ password }}
      {% endfor %}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy script
  ansible.builtin.copy:
    src: "{{ services_dir }}/probe/deploy/rmx-deploy-probe.sh"
    remote_src: true
    dest: /usr/local/sbin/rmx-deploy-probe
    owner: root
    group: root
    mode: "0755"

- name: Deploy log
  ansible.builtin.file:
    path: /var/log/rmx-deploy-probe.log
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve
