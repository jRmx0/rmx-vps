# The admin user (rmx) and the deploy user for GitHub Actions.

- name: Admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    password: "!"
    update_password: on_create

- name: Admin user's .ssh folder
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Admin user's SSH keys (only these)
  ansible.builtin.copy:
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    content: "{{ admin_ssh_keys | join('\n') }}\n"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"

- name: Admin user may sudo without a password (it has no password)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ admin_user }}
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: No key logs in as root
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: absent

# --- deploy: GitHub Actions of rmx-backend-probe (README §10 "Auto-deploy")
# No password, not in sudo or docker. Its one key may only run the deploy
# script, with one argument shaped like sha-<7 hex> (checked by sudoers too).
# The shell is bash only because sshd runs forced commands through it.
- name: Deploy user
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash
    password: "!"
    update_password: on_create

- name: Deploy user's .ssh folder
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"

- name: Deploy key, limited to the deploy command
  ansible.builtin.copy:
    dest: /home/deploy/.ssh/authorized_keys
    content: >
      restrict,command="sudo -n /usr/local/sbin/rmx-deploy-probe \"$SSH_ORIGINAL_COMMAND\""
      {{ vault_deploy_ssh_key }}
    owner: deploy
    group: deploy
    mode: "0600"

- name: Deploy user may run the deploy script, nothing else
  ansible.builtin.copy:
    src: "{{ repo_src }}/services/probe/deploy/sudoers-deploy"
    dest: /etc/sudoers.d/deploy
    mode: "0440"
    validate: visudo -cf %s

# --- ci: GitHub Actions of this repo (deploy.yml, README §11 "CI/CD")
# Same pattern as deploy: no password, not in sudo or docker, one key that
# may only run rmx-ci with backup, check:<sha> or apply:<sha> (sudoers checks
# the argument too). Created only when the vault has a key for it.
- name: The rmx-ci script (backup, deploy, restore)
  ansible.builtin.copy:
    src: "{{ repo_src }}/ansible/ci/rmx-ci.sh"
    dest: /usr/local/sbin/rmx-ci
    owner: root
    group: root
    mode: "0755"

- name: CI user
  when: vault_ci_ssh_key | default('') | length > 0
  block:
    - name: CI user
      ansible.builtin.user:
        name: ci
        shell: /bin/bash
        password: "!"
        update_password: on_create

    - name: CI user's .ssh folder
      ansible.builtin.file:
        path: /home/ci/.ssh
        state: directory
        owner: ci
        group: ci
        mode: "0700"

    - name: CI key, limited to the rmx-ci command
      ansible.builtin.copy:
        dest: /home/ci/.ssh/authorized_keys
        content: >
          restrict,command="sudo -n /usr/local/sbin/rmx-ci \"$SSH_ORIGINAL_COMMAND\""
          {{ vault_ci_ssh_key }}
        owner: ci
        group: ci
        mode: "0600"

    - name: CI user may run rmx-ci, nothing else
      ansible.builtin.copy:
        src: "{{ repo_src }}/ansible/ci/sudoers-ci"
        dest: /etc/sudoers.d/ci
        mode: "0440"
        validate: visudo -cf %s
