# Settings for RMX-SERVER that are not secret (this repo is public).
# Secrets are in vault.yml next to this file, encrypted with Ansible Vault.

# --- Admin access --------------------------------------------------------
admin_user: rmx
# Public keys that may log in as the admin user (the Windows PC).
admin_ssh_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIELxb1opNw3MfIQJzUkGWRN68rBZSQbQrYgbbyFl45PY rmx-vps

# The provider dashboard's "VPS Terminal" is an SSH bridge from this address
# that logs in as root with the root password (set by the provider). sshd
# allows root + password from here only, and fail2ban never bans it.
dashboard_ip: 45.81.252.94

# --- Base ----------------------------------------------------------------
swap_size_mb: 2048
swappiness: 10
# Removed if the provider image has them: nothing here uses them.
purge_packages:
  - snapd
# unattended-upgrades installs security updates every night and reboots
# when an update needs it (kernel, libc). Containers come back by themselves.
auto_reboot_time: "04:30"

# --- Firewall ------------------------------------------------------------
# Every public port. Docker publishes its ports past ufw anyway (README §10),
# so this list and the compose files must agree; it keeps `ufw status` honest.
public_ports:
  - { port: 22, comment: SSH }
  - { port: 80, comment: "HTTP (Caddy, ACME)" }
  - { port: 443, comment: "HTTPS (Caddy)" }
  - { port: 8883, comment: "MQTT over TLS (Mosquitto)" }

# --- Docker --------------------------------------------------------------
# Docker's apt signing key, as published in Docker's install docs.
docker_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

# --- Services ------------------------------------------------------------
repo_url: https://github.com/jRmx0/rmx-vps.git
repo_dir: /opt/rmx-vps
services_dir: "{{ repo_dir }}/services"
# Caddy gets this certificate; cert-sync copies it to Mosquitto.
mqtt_domain: mqtt.rmx.lt

# -e probe=on starts the probe and creates its app logins. Off by default
# (README §10 "Probe"); a plain run leaves a running probe alone.
probe: "off"
# This repo on the machine that runs ansible (files are copied from here).
repo_src: "{{ playbook_dir | dirname }}"
# Image used to hash Mosquitto passwords (same as services/mosquitto/compose.yaml).
mosquitto_image: eclipse-mosquitto:2.1-alpine
