# Mosquitto 2.1 config for mqtt.rmx.lt. See README §10 "Mosquitto".
# Reload after editing (no disconnects): docker compose kill -s HUP mosquitto

# Settings below apply to all listeners (one password file, one ACL).
per_listener_settings false

# --- Logins and access rules -------------------------------------------
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

# --- Storage and logs ---------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Public listener: MQTT over TLS (mowers, PC tools) ------------------
listener 8883
protocol mqtt
# Let's Encrypt cert from Caddy (full chain) and its key, see cert-sync/
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
# Minimum TLS version: 1.2 (1.3 is allowed too)
tls_version tlsv1.2
# The client ID is forced to the username, so one device can't kick
# another off by connecting with the same client ID.
use_username_as_clientid true

# --- Internal listener: plain MQTT for the app container ----------------
# Not published in compose.yaml, so not reachable from the internet.
listener 1883
protocol mqtt
