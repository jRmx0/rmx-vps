# Caddy: reverse proxy + automatic HTTPS (Let's Encrypt).
# Public ports 80 (ACME challenge + redirect to HTTPS) and 443 (HTTPS).

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      # Certificates and keys live here (gitignored, server only)
      - ./data/data:/data
      - ./data/config:/config
    # Basic-auth user and hash for /probe (server only, gitignored),
    # read by the Caddyfile as {$PROBE_AUTH_USER} and {$PROBE_AUTH_HASH}.
    # Optional: without it the Caddyfile's fallback keeps /probe locked.
    env_file:
      - path: .env
        required: false
    networks:
      - edge

networks:
  edge:
    name: rmx_edge
